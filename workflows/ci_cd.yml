name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest tests/ --maxfail=1 --disable-warnings

  build-docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t rostelecom-churn-pipeline .
      - name: Run container (smoke test)
        run: docker run --rm rostelecom-churn-pipeline
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag rostelecom-churn-pipeline ${{secrets.DOCKER_USERNAME}}/rostelecom-churn:latest
          docker push ${{secrets.DOCKER_USERNAME}}/rostelecom-churn:latest